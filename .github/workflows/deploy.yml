name: CI/CD — Django Docker Deploy

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  IMAGE_NAME: ilearn-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test
        env:
          SECRET_KEY: test_secret_key

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Ensure docker login on runner (no-op on server, but keeps logs clean)
        run: echo "Deploying to ${SERVER_IP}"

      - name: Deploy to server via SSH (pull & compose up)
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} <<EOF
          set -euo pipefail
          HOME_DIR="/home/${{ secrets.SERVER_USER }}"
          REPO_DIR="\$HOME_DIR/I-learn"
          
          if [ ! -d "\$REPO_DIR" ]; then
            git clone https://github.com/${{ github.repository }} "\$REPO_DIR"
          fi

          cd "\$REPO_DIR"
          git fetch --all --prune
          git reset --hard origin/develop
          
          printf '%s' "${{ secrets.ENV_FILE }}" | base64 -d > .env
        
          echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
          echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}" >> .env
        
          docker compose --env-file .env -f docker-compose.prod.yml pull
          docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
          
          docker compose --env-file .env -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput || true
          docker compose --env-file .env -f docker-compose.prod.yml up static_collector
          EOF
