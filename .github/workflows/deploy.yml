name: CI/CD Django Docker Deploy

on:
  push:
    branches: [ develop, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & start (dev compose)
        run: docker compose -f docker-compose.yml -p ci up -d --build

      - name: Migrate, collectstatic, test with JUnit report
        run: |
          docker compose -p ci exec -T backend python manage.py migrate --noinput
          docker compose -p ci exec -T backend python manage.py collectstatic --noinput
          mkdir -p reports
          docker compose -p ci exec -T backend python manage.py test \
            --verbosity=2 \
            --testrunner=xmlrunner.extra.djangotestrunner.XMLTestRunner \
            --output-file=reports/test-results.xml

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: reports/test-results.xml

      - name: Down
        if: always()
        run: docker compose -p ci down -v

  build_and_push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/${{ vars.IMAGE_NAME }}:latest
            ${{ vars.DOCKER_REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -eux
            cd /home/${{ secrets.SERVER_USER }}/I-learn
            # Декодируем ENV_FILE (base64)
            printf '%s' "${{ secrets.ENV_FILE }}" | base64 --decode > .env

            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
            docker compose --env-file .env -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput
            docker compose --env-file .env -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
