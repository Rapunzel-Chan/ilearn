[tool.poetry]
name = "i-learn"
version = "0.1.0"
description = ""
authors = ["Rapunzel <osina_kv@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.4"
django = "^5.2.4"
psycopg2-binary = "^2.9.10"
djangorestframework = "^3.16.0"
python-dotenv = "^1.1.1"
pillow = "^11.3.0"
django-filter = "^25.1"
djangorestframework-simplejwt = "^5.5.1"
ipython = "^9.4.0"
pytest = "^8.4.1"
coverage = "^7.10.3"
drf-spectacular = "^0.28.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.17.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
exclude_also = [
    'if __name__ == .__main__.:'
]

[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = ".git"
